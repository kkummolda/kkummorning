<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>꿈모닝 - 계정</title>
  <meta name="description" content="꿈모닝 회원가입 및 로그인 페이지입니다.">
  <meta name="theme-color" content="#182052">
  <!-- Paperlogy is self-hosted via @font-face in styles.css (text/Paperlogy-*.ttf) -->
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ICON SPRITE — hand-drawn line icons, replaces Font Awesome + emoji glyphs -->
  <svg style="display:none" aria-hidden="true">
    <defs>
      <symbol id="icon-login" viewBox="0 0 24 24"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.2"/><path d="M5 20c1-4 4.3-6 7-6s6 2 7 6"/></symbol>
      <symbol id="icon-user-plus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c1-4 3.5-6 6-6s5 2 6 6"/><path d="M18 7.5v5"/><path d="M15.5 10h5"/></symbol>
      <symbol id="icon-shield-user" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 5-3.3 7.8-7 9-3.7-1.2-7-4-7-9V6l7-3z"/><circle cx="12" cy="10.5" r="2"/><path d="M8.5 16c.7-2 2-3 3.5-3s2.8 1 3.5 3"/></symbol>
      <symbol id="icon-fire" viewBox="0 0 24 24"><path d="M12 2c1 3.2-2.2 4.6-2.2 8a2.2 2.2 0 0 0 4.4 0c0-1-.4-1.6-.9-2.2 1.4.5 2.7 2.4 2.7 4.7a4.5 4.5 0 0 1-9 0C7 8.8 10.5 6.4 12 2z"/></symbol>
      <symbol id="icon-music" viewBox="0 0 24 24"><circle cx="7" cy="18" r="2.4"/><circle cx="17" cy="16" r="2.4"/><path d="M9.4 18V6.5l10-2v11.5"/></symbol>
      <symbol id="icon-volume-high" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M15.3 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="icon-volume-low" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M15.3 9.2a4 4 0 0 1 0 5.6"/></symbol>
      <symbol id="icon-volume-mute" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M14.8 9.2l5 5.6"/><path d="M19.8 9.2l-5 5.6"/></symbol>
      <symbol id="icon-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="M6.5 4.2v15.6a.8.8 0 0 0 1.2.7l12.5-7.8a.8.8 0 0 0 0-1.4L7.7 3.5a.8.8 0 0 0-1.2.7z"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><rect x="6.5" y="4.5" width="3.6" height="15" rx="1"/><rect x="13.9" y="4.5" width="3.6" height="15" rx="1"/></symbol>
      <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.5-5.6"/><path d="M4.5 4.5v4.4h4.4"/></symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4"/><path d="M10 6l-6 6 6 6"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="M15 5.5l-7 6.5 7 6.5"/></symbol>
      <symbol id="icon-pen" viewBox="0 0 24 24"><path d="M4 20l.9-3.9L15.5 5.5l3.4 3.4-10.6 10.6L4 20z"/><path d="M14 7l3.4 3.4"/></symbol>
      <symbol id="icon-edit-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h8l3.5 3.5v13.5h-11.5V3.5z"/><path d="M14.5 3.5v3.5H18"/><path d="M9 15.2l.7-2.9 5.3-5.3 2.2 2.2-5.3 5.3-2.9.7z"/></symbol>
      <symbol id="icon-quote" viewBox="0 0 24 24"><path d="M7.5 8c-2.1 0-3.7 1.7-3.7 4.2S5.4 16.4 7.5 16.4V19c-3.5 0-6.2-2.9-6.2-6.5s2.7-6.7 6.2-6.7V8z"/><path d="M17 8c-2.1 0-3.7 1.7-3.7 4.2S14.9 16.4 17 16.4V19c-3.5 0-6.2-2.9-6.2-6.5S13.5 5.8 17 5.8V8z"/></symbol>
      <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18a4.3 4.3 0 0 1-.4-8.6A6 6 0 0 1 18 9.6a4 4 0 0 1-1 8.4H7z"/></symbol>
      <symbol id="icon-cloud-upload" viewBox="0 0 24 24"><path d="M7 17.5a4.3 4.3 0 0 1-.4-8.6A6 6 0 0 1 18 9.1a4 4 0 0 1-1 7.9"/><path d="M12 11.5v7.5"/><path d="M9 14.3l3-3 3 3"/></symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.3"/><rect x="13" y="4" width="7" height="7" rx="1.3"/><rect x="4" y="13" width="7" height="7" rx="1.3"/><rect x="13" y="13" width="7" height="7" rx="1.3"/></symbol>
      <symbol id="icon-history" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4.4h4.4"/><path d="M12 8v4.3l3 2"/></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4.3l8 7.2"/><path d="M6 10.2v9.3h4.2v-4.6h3.6v4.6H18v-9.3"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
      <symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5V4z"/><path d="M8 4v5.2h7V4"/><path d="M8 14h8v6H8v-6z"/></symbol>
      <symbol id="icon-key" viewBox="0 0 24 24"><circle cx="7.8" cy="15.2" r="3.7"/><path d="M10.5 12.5 19 4"/><path d="M15.5 8l2.8 2.8"/><path d="M13 10.5l2.2 2.2"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v10.5"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 19.5V9"/><path d="M8 12.5l4-4 4 4"/><path d="M5 19h14"/></symbol>
      <symbol id="icon-flag" viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4.3h11l-2.3 3.7L17 11.7H6"/></symbol>
      <symbol id="icon-spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9"/></symbol>
      <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14z"/><path d="M5.2 18.8c2-4 5-7.2 9-9.2"/></symbol>
      <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M15.2 8.8l-1.7 5.6-5.6 1.7 1.7-5.6 5.6-1.7z"/></symbol>
      <symbol id="icon-sprout" viewBox="0 0 24 24"><path d="M12 21v-7.5"/><path d="M12 13.8c0-4-3.2-6-7-6 0 4 3.2 6 7 6z"/><path d="M12 11c0-3.4 2.6-5.3 6-5.3 0 3.4-2.6 5.3-6 5.3z"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16"/><path d="M8 3v4M16 3v4"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
      <symbol id="icon-circle-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="8" r="0.9" class="icon-fill"/><path d="M10.8 11.3h1.3v5.4h1.2"/></symbol>
      <symbol id="icon-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M8.2 12.4l2.6 2.6 5-5.6"/></symbol>
      <symbol id="icon-circle-exclamation" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.5v6"/><circle cx="12" cy="16.6" r="0.9" class="icon-fill"/></symbol>
      <symbol id="icon-building" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1"/><path d="M10 7h.01M14 7h.01M10 11h.01M14 11h.01M10 15h.01M14 15h.01"/><path d="M10 21v-4h4v4"/></symbol>
      <symbol id="icon-sparkle" viewBox="0 0 24 24"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6-5.6-1.9 5.6-1.9 1.9-5.6z"/></symbol>
      <symbol id="icon-rain" viewBox="0 0 24 24"><path d="M6.7 15.3a3.9 3.9 0 0 1 .5-7.8A5 5 0 0 1 17 8.6a3.4 3.4 0 0 1-.5 6.7H6.7z"/><path d="M8 18.5l-1 2M12 18.5l-1 2M16 18.5l-1 2"/></symbol>
      <symbol id="icon-tree" viewBox="0 0 24 24"><path d="M12 2.3l3.4 5.7h-2l2.9 4.9h-2.2l2.7 4.6H7.2l2.7-4.6H7.7l2.9-4.9h-2l3.4-5.7z"/><path d="M12 17.5V21"/></symbol>
      <symbol id="icon-orb" viewBox="0 0 24 24"><circle cx="12" cy="10.5" r="6"/><path d="M6.5 20h11"/><path d="M9.3 20l1-3.2M14.7 20l-1-3.2"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M15.5 4.5a8 8 0 1 0 4 12A9.5 9.5 0 0 1 15.5 4.5z"/></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.6C11.1 5.5 11.5 5.5 12 5.5c6 0 9.5 6.5 9.5 6.5a15.6 15.6 0 0 1-3.2 4.1M6.6 6.6C4.4 8.1 2.5 12 2.5 12S6 18.5 12 18.5c1.2 0 2.3-.2 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    </defs>
  </svg>

  <canvas id="ambient-canvas"></canvas>

  <div class="app-container">
    <!-- ACCOUNT & SETTINGS NAVIGATION HEADER -->
    <header class="app-header">
      <div class="header-brand">
        <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
          <svg class="icon logo-icon" aria-hidden="true"><use href="#icon-moon"></use></svg>
          <div class="brand-text">
            <h1>꿈모닝</h1>
          </div>
        </a>
      </div>

      <nav class="stepper-nav-header">
        <a href="index.html" class="nav-link-btn" style="text-decoration: none;"><svg class="icon"><use href="#icon-home"></use></svg> 챌린지 홈</a>
        <a href="auth.html" class="nav-link-btn active" style="text-decoration: none;"><svg class="icon"><use href="#icon-shield-user"></use></svg> 계정</a>
      </nav>

      <div class="header-status">
        <button class="btn btn-outline btn-sm" id="open-auth-modal-btn" onclick="openAuthModal()" style="padding: 4px 12px; font-size: 0.82rem; border-color: var(--accent-blue); color: var(--accent-blue); cursor: pointer;">
          <svg class="icon"><use href="#icon-login"></use></svg> 로그인 / 가입
        </button>
        <div class="user-profile-pill" id="header-user-profile" style="display: none; align-items: center; gap: 6px; background: var(--bg-card-secondary); border: 1px solid var(--border-subtle); padding: 5px 12px; border-radius: var(--radius-pill); font-size: 13px; cursor: pointer; color: var(--accent-blue);">
          <svg class="icon"><use href="#icon-user"></use></svg> <span id="header-user-name">Dreamer</span>
          <svg class="icon" id="header-logout-icon" title="로그아웃" style="margin-left: 4px; opacity: 0.7;"><use href="#icon-logout"></use></svg>
        </div>
      </div>
    </header>

    <main class="main-content" style="margin-top: 20px;">
      <div class="chronos-banner-card">
        <div class="step-badge">계정</div>
        <h2 class="chronos-banner-title">내 계정을 관리하세요</h2>
        <p class="chronos-banner-desc">로그인하면 기록이 클라우드에 자동 저장되어 여러 기기에서 이어서 사용할 수 있어요.</p>

        <!-- Account Info Card (shown when already logged in) -->
        <div id="account-info-card" style="max-width: 420px; margin-top: 20px; display: none;">
          <div class="sound-controls-card">
            <h3 style="margin-bottom: 14px; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
              <svg class="icon" style="color: var(--accent-blue);"><use href="#icon-user"></use></svg> 내 계정 정보
            </h3>

            <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px;">
              <div>
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">닉네임</label>
                <div id="account-info-name" style="font-size: 1rem; color: var(--text-main); font-weight: 600;">-</div>
              </div>
              <div>
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">이메일</label>
                <div id="account-info-email" style="font-size: 1rem; color: var(--text-main);">-</div>
              </div>
            </div>

            <button type="button" class="btn btn-outline" id="account-logout-btn" style="width: 100%; justify-content: center; padding: 12px; cursor: pointer;">
              <svg class="icon"><use href="#icon-logout"></use></svg> 로그아웃
            </button>
          </div>
        </div>

        <div id="auth-form-card" style="max-width: 420px; margin-top: 20px;">
          <!-- Auth Form Card -->
          <div class="sound-controls-card">
            <h3 style="margin-bottom: 14px; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
              <svg class="icon" style="color: var(--accent-blue);"><use href="#icon-user-plus"></use></svg> 계정 가입 및 로그인
            </h3>

            <!-- Auth Tabs -->
            <div style="display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg-card); padding: 4px; border-radius: var(--radius-pill);">
              <button class="btn btn-outline" id="tab-signup" style="flex: 1; border: none; font-size: 0.88rem; padding: 8px;">회원가입</button>
              <button class="btn btn-outline active" id="tab-signin" style="flex: 1; border: none; font-size: 0.88rem; padding: 8px;">로그인</button>
            </div>

            <form id="auth-form" onsubmit="window.submitAuthForm(); return false;">
              <div id="signup-name-group" style="display: none; margin-bottom: 12px;">
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">성함 / 닉네임</label>
                <input type="text" id="auth-name-input" class="chronos-input" placeholder="홍길동" autocomplete="name" style="width: 100%;">
              </div>

              <div style="margin-bottom: 12px;">
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">이메일 주소</label>
                <input type="email" id="auth-email-input" class="chronos-input" placeholder="user@example.com" required autocomplete="email" style="width: 100%;">
              </div>

              <div style="margin-bottom: 12px;">
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">비밀번호 (6자 이상)</label>
                <div style="position: relative;">
                  <input type="password" id="auth-password-input" class="chronos-input" placeholder="••••••••" required minlength="6" autocomplete="current-password" style="width: 100%; padding-right: 42px; box-sizing: border-box;">
                  <button type="button" id="auth-password-toggle-btn" aria-label="비밀번호 표시" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: flex;">
                    <svg class="icon"><use href="#icon-eye"></use></svg>
                  </button>
                </div>
              </div>

              <div id="signup-confirm-password-group" style="display: none; margin-bottom: 12px;">
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">비밀번호 확인</label>
                <input type="password" id="auth-confirm-password-input" class="chronos-input" placeholder="••••••••" minlength="6" autocomplete="new-password" style="width: 100%;">
              </div>

              <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 0.82rem; color: var(--text-muted); cursor: pointer;">
                <input type="checkbox" id="auth-remember-checkbox" checked style="width: 16px; height: 16px; accent-color: var(--accent-blue); cursor: pointer;">
                로그인 상태 유지
              </label>

              <button type="button" class="btn btn-engage" id="auth-submit-btn" onclick="window.submitAuthForm()" style="width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem; cursor: pointer;">
                <svg class="icon" id="auth-submit-icon"><use href="#icon-login" id="auth-submit-icon-use"></use></svg> <span id="auth-submit-label">로그인</span>
              </button>
            </form>

            <div style="text-align: center; margin-top: 10px;">
              <button type="button" id="forgot-password-link" style="background: none; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; text-decoration: underline;">비밀번호를 잊으셨나요?</button>
            </div>

            <div id="reset-password-card" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-subtle);">
              <h3 style="margin-bottom: 10px; font-size: 1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
                <svg class="icon" style="color: var(--accent-blue);"><use href="#icon-key"></use></svg> 새 비밀번호 설정
              </h3>
              <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">이메일로 받은 링크를 통해 접속하셨습니다. 새 비밀번호를 입력해 주세요.</p>
              <input type="password" id="new-password-input" class="chronos-input" placeholder="새 비밀번호 (6자 이상)" minlength="6" style="width: 100%; margin-bottom: 12px;">
              <button type="button" class="btn btn-engage" id="update-password-btn" style="width: 100%; justify-content: center; padding: 12px; cursor: pointer;">
                <svg class="icon"><use href="#icon-save"></use></svg> 비밀번호 변경하기
              </button>
            </div>
          </div>
        </div>

        <div class="step-footer-actions" style="margin-top: 24px; display: flex; justify-content: flex-start; align-items: center;">
          <a href="index.html" class="btn btn-outline" style="text-decoration: none;">
            <svg class="icon"><use href="#icon-chevron-left"></use></svg> 챌린지 홈으로 돌아가기
          </a>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
