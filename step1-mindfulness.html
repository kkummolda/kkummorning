<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>꿈모닝 - 1단계: 마음 보기 (Mindfulness)</title>
  <meta name="description" content="오늘 하루의 소음을 끄고 5분 명상 타이머와 힐링 사운드로 마음을 차분히 가다듬는 마음 보기 독립 프로토타입 페이지입니다.">
  <meta name="theme-color" content="#0b0e17">
  <!-- Google Fonts: Inter, Outfit, Gowun Batang -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome & Supabase SDK -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="ambient-canvas"></canvas>

  <div class="app-container">
    <!-- PLAYBOARD NAVIGATION HEADER -->
    <header class="app-header">
      <div class="header-brand">
        <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
          <div class="logo-icon">🌙</div>
          <div class="brand-text">
            <h1>꿈모닝 <span style="font-size: 0.7rem; color: var(--accent-mint); font-weight: 500;">(Page Prototype 1)</span></h1>
          </div>
        </a>
      </div>

      <nav class="stepper-nav-header">
        <a href="index.html" class="nav-link-btn" style="text-decoration: none;"><i class="fa-solid fa-gauge"></i> Playboard</a>
        <a href="step1-mindfulness.html" class="nav-link-btn active" style="text-decoration: none;">1단계: 마음 보기</a>
        <a href="step2-values.html" class="nav-link-btn" style="text-decoration: none;">2단계: 가치 생각</a>
        <a href="step3-feedback.html" class="nav-link-btn" style="text-decoration: none;">3단계: 일일 피드백</a>
        <a href="step4-dashboard.html" class="nav-link-btn" style="text-decoration: none;">4단계: 21일 잔디</a>
        <a href="pages-list.html" class="nav-link-btn" style="text-decoration: none;"><i class="fa-solid fa-list"></i> 목록</a>
      </nav>

      <div class="header-status">
        <button class="btn btn-outline btn-sm" id="open-auth-modal-btn" onclick="openAuthModal()" style="padding: 4px 12px; font-size: 0.82rem; border-color: var(--accent-blue); color: var(--accent-blue); cursor: pointer;">
          <i class="fa-solid fa-right-to-bracket"></i> 로그인 / 가입
        </button>
        <div class="user-profile-pill" id="header-user-profile" style="display: none; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-subtle); padding: 5px 12px; border-radius: var(--radius-pill); font-size: 13px; cursor: pointer; color: var(--accent-blue);">
          <i class="fa-solid fa-circle-user"></i> <span id="header-user-name">Dreamer</span>
          <i class="fa-solid fa-right-from-bracket" id="header-logout-icon" title="로그아웃" style="margin-left: 4px; opacity: 0.7;"></i>
        </div>
      </div>
    </header>

    <main class="main-content" style="margin-top: 20px;">
      <!-- STEP 1: 마음 보기 -->
      <section class="step-view active" id="view-step-1">
        <div class="chronos-banner-card">
          <div class="step-badge">1단계: 마음 보기 (Mindfulness Process)</div>
          <h2 class="chronos-banner-title">오늘 하루의 소음을 끄고, 차분하게 마음을 가다듬으세요</h2>
          <p class="chronos-banner-desc">조용한 백색소음이나 힐링 오르골 톤을 틀어두고 깊은 호흡을 3회 진행해보세요.</p>

          <div class="timer-ambient-grid">
            <!-- Timer Circle -->
            <div class="timer-container">
              <svg class="timer-svg" viewBox="0 0 200 200">
                <circle class="timer-bg-circle" cx="100" cy="100" r="88"></circle>
                <circle class="timer-progress-circle" id="timer-ring" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"></circle>
              </svg>
              <div class="timer-display">
                <span class="timer-time" id="timer-digits">05:00</span>
                <span class="timer-subtext" id="timer-status">마음 보기 준비</span>
              </div>
            </div>

            <!-- Sound Controls -->
            <div class="sound-controls-card">
              <h3><i class="fa-solid fa-music"></i> 힐링 미덕 사운드 선택</h3>
              <div class="sound-preset-grid">
                <button class="sound-chip active" data-sound="rain">
                  <span class="chip-icon">🌧️</span>
                  <span class="chip-title">차분한 밤 빗소리</span>
                </button>
                <button class="sound-chip" data-sound="forest">
                  <span class="chip-icon">🌲</span>
                  <span class="chip-title">숲속의 아늑한 바람</span>
                </button>
                <button class="sound-chip" data-sound="musicbox">
                  <span class="chip-icon">🔮</span>
                  <span class="chip-title">432Hz 명상 오르골</span>
                </button>
                <button class="sound-chip" data-sound="fire">
                  <span class="chip-icon">🔥</span>
                  <span class="chip-title">따뜻한 모닥불 장작</span>
                </button>
              </div>

              <div class="volume-slider-wrapper">
                <label for="volume-slider"><i class="fa-solid fa-volume-low"></i> 음량 조절</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.4">
              </div>

              <div class="timer-btn-group">
                <button class="btn btn-primary btn-glow" id="start-timer-btn">
                  <i class="fa-solid fa-play"></i> 5분 마음 보기 시작
                </button>
                <button class="btn btn-outline" id="pause-timer-btn" disabled>
                  <i class="fa-solid fa-pause"></i> 일시정지
                </button>
                <button class="btn btn-outline" id="reset-timer-btn">
                  <i class="fa-solid fa-rotate-left"></i> 리셋
                </button>
              </div>
            </div>
          </div>

          <div class="step-footer-actions" style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="btn btn-outline" style="text-decoration: none;">
              <i class="fa-solid fa-chevron-left"></i> Playboard 메인으로
            </a>
            <a href="step2-values.html" class="btn btn-engage" style="text-decoration: none;">
              다음: 2단계 가치 생각하기 <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
